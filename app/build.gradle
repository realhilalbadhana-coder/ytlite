plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hilal.ytlite'
    compileSdk 34

    defaultConfig {
        applicationId "com.hilal.ytlite"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies on purpose: the whole UI is a bundled
// WebView asset, so the project stays tiny and builds fast in CI.
dependencies { }
