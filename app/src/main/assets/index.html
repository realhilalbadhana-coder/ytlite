<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>YTLite</title>
<style>
  :root {
    --bg: #030303;
    --card: #0f0f0f;
    --card-2: #161616;
    --line: #1f1f1f;
    --text: #f1f1f1;
    --muted: #9a9a9a;
    --red: #ff0000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    padding-bottom: 84px;
  }

  /* ---------- Header ---------- */
  .header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 10px;
    background: rgba(3,3,3,0.94);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .mark {
    width: 30px; height: 22px; border-radius: 6px; background: var(--red);
    display: flex; align-items: center; justify-content: center;
  }
  .brand .mark::after {
    content: ""; border-left: 8px solid #fff; border-top: 5px solid transparent;
    border-bottom: 5px solid transparent; margin-left: 2px;
  }
  .brand .name { font-size: 19px; font-weight: 700; letter-spacing: -0.5px; }
  .brand .tag {
    font-size: 10px; font-weight: 700; color: var(--muted);
    background: var(--card-2); padding: 2px 6px; border-radius: 5px; margin-left: 2px;
  }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none;
    background: var(--card-2); color: var(--text); font-size: 16px;
  }

  /* ---------- Search ---------- */
  .search-wrap { padding: 12px 16px 4px; }
  .search {
    display: flex; gap: 8px;
  }
  .search input {
    flex: 1; padding: 12px 16px; border-radius: 22px;
    border: 1px solid var(--line); background: var(--card);
    color: var(--text); font-size: 15px; outline: none;
  }
  .search input:focus { border-color: var(--red); }
  .search button {
    padding: 0 18px; border-radius: 22px; border: none;
    background: var(--red); color: #fff; font-weight: 700; font-size: 14px;
  }

  /* ---------- Chips ---------- */
  .chips {
    display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 6px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 7px 14px; border-radius: 20px;
    background: var(--card-2); border: 1px solid var(--line);
    color: var(--text); font-size: 13px; white-space: nowrap;
  }
  .chip.active { background: #fff; color: #000; border-color: #fff; font-weight: 600; }

  /* ---------- Section titles ---------- */
  h3 {
    font-size: 16px; margin: 16px 16px 10px; display: flex; align-items: center; gap: 8px;
  }
  h3 .dot { width: 6px; height: 18px; border-radius: 3px; background: var(--red); }

  /* ---------- Shorts row ---------- */
  .shorts {
    display: flex; gap: 10px; overflow-x: auto; padding: 0 16px 6px;
    scrollbar-width: none;
  }
  .shorts::-webkit-scrollbar { display: none; }
  .short {
    flex: 0 0 auto; width: 128px; border-radius: 12px; overflow: hidden;
    background: var(--card); border: 1px solid var(--line); position: relative;
  }
  .short img { width: 100%; aspect-ratio: 9/16; object-fit: cover; display: block; background: #1a1a1a; }
  .short .cap {
    padding: 8px; font-size: 11px; line-height: 1.3; color: var(--text);
    height: 46px; overflow: hidden;
  }

  /* ---------- Feed grid ---------- */
  .feed { display: grid; grid-template-columns: 1fr; gap: 18px; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .thumb { position: relative; }
  .thumb img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #1a1a1a; }
  .thumb .dur {
    position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,0.8);
    font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 600;
  }
  .meta { display: flex; gap: 12px; padding: 12px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex: 0 0 auto;
    background: linear-gradient(135deg, #ff0000, #8a0000);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #fff;
  }
  .meta .t { font-size: 14px; line-height: 1.35; font-weight: 500; max-height: 40px; overflow: hidden; }
  .meta .s { font-size: 12px; color: var(--muted); margin-top: 5px; }

  /* ---------- Bottom nav ---------- */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    display: flex; justify-content: space-around; align-items: center;
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    background: rgba(3,3,3,0.97); border-top: 1px solid var(--line);
  }
  .nav .item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; color: var(--muted); background: none; border: none;
  }
  .nav .item.on { color: #fff; }
  .nav .glyph { font-size: 18px; }
  .nav .plus {
    width: 42px; height: 30px; border-radius: 9px; background: var(--card-2);
    display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff;
  }

  /* ---------- Player overlay ---------- */
  .player {
    display: none; position: fixed; inset: 0; z-index: 200; background: #000;
    flex-direction: column;
  }
  .player.open { display: flex; }
  .player .stage { width: 100%; aspect-ratio: 16/9; background: #000; }
  .player iframe { width: 100%; height: 100%; border: 0; }
  .player .info { padding: 16px; flex: 1; overflow-y: auto; }
  .player .info h2 { font-size: 16px; line-height: 1.4; margin-bottom: 8px; }
  .player .info p { color: var(--muted); font-size: 13px; }
  .player .close {
    margin: 16px; padding: 13px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card-2); color: var(--text); font-size: 14px; font-weight: 600;
  }
  .skeleton { padding: 24px; text-align: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <div class="mark"></div>
      <span class="name">YTLite</span>
      <span class="tag">PLAYER</span>
    </div>
    <button class="icon-btn" onclick="focusSearch()">&#128269;</button>
  </div>

  <div class="search-wrap">
    <div class="search">
      <input id="q" type="text" placeholder="Search videos, creators, topics..." />
      <button onclick="doSearch()">Go</button>
    </div>
  </div>

  <div class="chips" id="chips"></div>

  <h3><span class="dot"></span>Short videos</h3>
  <div class="shorts" id="shorts"><div class="skeleton">Loading...</div></div>

  <h3><span class="dot"></span>Recommended</h3>
  <div class="feed" id="feed"><div class="skeleton">Loading...</div></div>

  <div class="nav">
    <button class="item on"><span class="glyph">&#127968;</span>Home</button>
    <button class="item"><span class="glyph">&#9889;</span>Shorts</button>
    <div class="plus">+</div>
    <button class="item"><span class="glyph">&#128225;</span>Subs</button>
    <button class="item"><span class="glyph">&#128100;</span>You</button>
  </div>

  <div class="player" id="player">
    <div class="stage"><iframe id="frame" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
    <div class="info">
      <h2 id="p-title"></h2>
      <p id="p-author"></p>
    </div>
    <button class="close" onclick="closePlayer()">&#10005; Close</button>
  </div>

<script>
/* ------------------------------------------------------------------
   YTLite - interface layer
   Playback uses YouTube's OFFICIAL embed player (youtube.com/embed).
   Metadata comes from YouTube's public oEmbed endpoint (no key needed).
   Optionally paste a YouTube Data API v3 key below for real search;
   leave it empty to search the built-in demo set.
------------------------------------------------------------------ */
const API_KEY = ""; // optional: paste your own YouTube Data API v3 key

const CATEGORIES = ["All", "Trending", "Music", "Live", "Gaming", "News", "Movies"];

// Built-in demo catalogue (public video ids). Titles are fetched live via oEmbed.
const DEMO = [
  "dQw4w9WgXcQ", "9bZkp7q19f0", "kJQP7kiw5Fk", "JGwWNGJdvx8",
  "OPf0YbXqDm0", "fJ9rUzIMcZQ", "hT_nvWreIhg", "RgKAFK5djSk",
  "CevxZvSJLk8", "YQHsXMglC9A", "60ItHLz5WEA", "kXYiU_JCYtU"
];

const metaCache = {};

function renderChips() {
  const box = document.getElementById('chips');
  box.innerHTML = CATEGORIES.map((c, i) =>
    `<button class="chip ${i === 0 ? 'active' : ''}" onclick="pickChip(this)">${c}</button>`).join('');
}
function pickChip(el) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}
function focusSearch() { document.getElementById('q').focus(); }

// Fetch title/author for a video id through the public oEmbed endpoint.
async function getMeta(id) {
  if (metaCache[id]) return metaCache[id];
  let out = { id, title: 'Video', author: 'YouTube', thumb: `https://i.ytimg.com/vi/${id}/hqdefault.jpg` };
  try {
    const r = await fetch('https://www.youtube.com/oembed?format=json&url=' +
      encodeURIComponent('https://www.youtube.com/watch?v=' + id));
    if (r.ok) {
      const j = await r.json();
      out.title = j.title || out.title;
      out.author = j.author_name || out.author;
      if (j.thumbnail_url) out.thumb = j.thumbnail_url;
    }
  } catch (e) { /* keep fallback */ }
  metaCache[id] = out;
  return out;
}

function cardHtml(m) {
  const initial = (m.author || 'Y').trim().charAt(0).toUpperCase();
  return `<div class="card" onclick="openPlayer('${m.id}','${esc(m.title)}','${esc(m.author)}')">
      <div class="thumb"><img loading="lazy" src="${m.thumb}" alt=""><span class="dur">HD</span></div>
      <div class="meta">
        <div class="avatar">${initial}</div>
        <div>
          <div class="t">${esc(m.title)}</div>
          <div class="s">${esc(m.author)} &middot; Ad-supported embed</div>
        </div>
      </div>
    </div>`;
}
function shortHtml(m) {
  return `<div class="short" onclick="openPlayer('${m.id}','${esc(m.title)}','${esc(m.author)}')">
      <img loading="lazy" src="${m.thumb}" alt="">
      <div class="cap">${esc(m.title)}</div>
    </div>`;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function loadFeed(ids) {
  const feed = document.getElementById('feed');
  const shorts = document.getElementById('shorts');
  feed.innerHTML = '<div class="skeleton">Loading feed...</div>';
  shorts.innerHTML = '<div class="skeleton">Loading...</div>';
  const metas = await Promise.all(ids.map(getMeta));
  feed.innerHTML = metas.map(cardHtml).join('');
  shorts.innerHTML = metas.slice(0, 6).map(shortHtml).join('');
}

async function doSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) { loadFeed(DEMO); return; }
  const feed = document.getElementById('feed');
  feed.innerHTML = '<div class="skeleton">Searching...</div>';

  if (API_KEY) {
    try {
      const url = 'https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=15' +
        '&key=' + API_KEY + '&q=' + encodeURIComponent(q);
      const r = await fetch(url);
      const j = await r.json();
      const ids = (j.items || []).map(i => i.id.videoId).filter(Boolean);
      if (ids.length) { await loadFeed(ids); return; }
    } catch (e) { /* fall through */ }
  }

  // No key (or API failed): filter the demo set by title/author text.
  const metas = await Promise.all(DEMO.map(getMeta));
  const hit = metas.filter(m =>
    (m.title + ' ' + m.author).toLowerCase().includes(q.toLowerCase()));
  document.getElementById('shorts').innerHTML = '';
  feed.innerHTML = hit.length
    ? hit.map(cardHtml).join('')
    : '<div class="skeleton">No matches in the demo set. Add an API key in the code for full search.</div>';
}

function openPlayer(id, title, author) {
  document.getElementById('frame').src =
    'https://www.youtube.com/embed/' + id + '?autoplay=1&playsinline=1&rel=0';
  document.getElementById('p-title').textContent = title;
  document.getElementById('p-author').textContent = author;
  document.getElementById('player').classList.add('open');
}
function closePlayer() {
  document.getElementById('frame').src = '';
  document.getElementById('player').classList.remove('open');
}
// Called from the native back button.
window.handleBack = function () {
  if (document.getElementById('player').classList.contains('open')) { closePlayer(); return true; }
  return false;
};

document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
renderChips();
loadFeed(DEMO);
</script>
</body>
</html>
